# otel-collector-config.yaml
# OpenTelemetry Collector configuration for ForgeAI local development.
#
# Pipeline:
#   AI Service (OTLP gRPC :4317) → OTel Collector → Jaeger (:14250)
#
# Access Jaeger UI at http://localhost:16686

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true
  logging:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, logging]
