server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Repository Service (port 8001) ─────────────────────────────────────────
    # GitHub webhook + callback (no org prefix)
    location /api/v1/github {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standalone repository routes  e.g. /api/v1/repositories/42/sync
    location /api/v1/repositories {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Org-scoped GitHub routes  e.g. /api/v1/organizations/1/github/...
    location ~ ^/api/v1/organizations/[0-9]+/github {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Org-scoped repository routes  e.g. /api/v1/organizations/1/repositories
    location ~ ^/api/v1/organizations/[0-9]+/repositories {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── AI Service (port 8002) ─────────────────────────────────────────────────
    # Conversations and messages (org-scoped)
    location ~ ^/api/v1/organizations/[0-9]+/conversations {
        proxy_pass         http://ai:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Code reviews (org-scoped)
    location ~ ^/api/v1/organizations/[0-9]+/code-reviews {
        proxy_pass         http://ai:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standalone code-reviews routes
    location /api/v1/code-reviews {
        proxy_pass         http://ai:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Feature plans routes
    location /api/v1/feature-plans {
        proxy_pass         http://ai:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Build runs routes & SSE streaming
    location /api/v1/build-runs {
        proxy_pass             http://ai:8002;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       Connection '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        chunked_transfer_encoding on;
    }

    # Standalone conversation routes (get, delete, messages, stream)
    location /api/v1/conversations {
        proxy_pass             http://ai:8002;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE / streaming — disable nginx buffering
        proxy_set_header       Connection '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        chunked_transfer_encoding on;
    }

    # Agent-run status
    location /api/v1/agent-runs {
        proxy_pass         http://ai:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API Service (port 8000) — catch-all ────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
