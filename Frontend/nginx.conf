server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Repository Service (port 8001) ─────────────────────────────────────────
    # GitHub webhook + callback (no org prefix)
    location /api/v1/github {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standalone repository routes  e.g. /api/v1/repositories/42/sync
    location /api/v1/repositories {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Org-scoped GitHub routes  e.g. /api/v1/organizations/1/github/...
    location ~ ^/api/v1/organizations/[0-9]+/github {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Org-scoped repository routes  e.g. /api/v1/organizations/1/repositories
    location ~ ^/api/v1/organizations/[0-9]+/repositories {
        proxy_pass         http://repository:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API Service (port 8000) — catch-all ────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
