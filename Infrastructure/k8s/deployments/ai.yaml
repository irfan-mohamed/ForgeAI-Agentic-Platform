apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: forgeai
  labels:
    app: ai
    app.kubernetes.io/component: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: ai
          image: 328967576122.dkr.ecr.ap-southeast-2.amazonaws.com/forgeai-ai:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: forgeai-config
            - secretRef:
                name: forgeai-secrets
          env:
            - name: RAG_RERANK_ENABLED
              value: "false"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: forgeai-groq
                  key: GROQ_API_KEY
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
