# External Secrets Operator — syncs secrets from AWS Secrets Manager.
# Install ESO first: https://external-secrets.io/latest/introduction/getting-started/
#
# Create the secret in AWS first:
#   aws secretsmanager create-secret --name forgeai/production \
#     --secret-string '{"POSTGRES_PASSWORD":"...","SECRET_KEY":"...","GROQ_API_KEY":"...","GITHUB_TOKEN":"...","GITHUB_APP_ID":"...","GITHUB_WEBHOOK_SECRET":"..."}'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgeai-secrets
  namespace: forgeai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: forgeai-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: forgeai/production
        property: POSTGRES_PASSWORD
    - secretKey: SECRET_KEY
      remoteRef:
        key: forgeai/production
        property: SECRET_KEY
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: forgeai/production
        property: GROQ_API_KEY
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: forgeai/production
        property: GITHUB_TOKEN
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: forgeai/production
        property: GITHUB_APP_ID
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: forgeai/production
        property: GITHUB_WEBHOOK_SECRET
---
# ClusterSecretStore — points at AWS Secrets Manager in your region.
# Replace <ROLE_ARN> with an IAM role that has secretsmanager:GetSecretValue permission.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
