apiVersion: v1
kind: Namespace
metadata:
  name: forgeai-build-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress-egress
  namespace: forgeai-build-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: build-sandbox-quota
  namespace: forgeai-build-sandbox
spec:
  hard:
    count/jobs.batch: "4"
    count/secrets: "8"
    pods: "4"
    requests.cpu: "1"
    requests.memory: 1536Mi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgeai-build-controller
  namespace: forgeai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgeai-build-controller
  namespace: forgeai-build-sandbox
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgeai-build-controller
  namespace: forgeai-build-sandbox
subjects:
  - kind: ServiceAccount
    name: forgeai-build-controller
    namespace: forgeai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgeai-build-controller
