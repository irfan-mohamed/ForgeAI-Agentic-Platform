apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgeai-github-deployer
  namespace: forgeai
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [api, repository, ai, worker, frontend]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgeai-github-deployer
  namespace: forgeai
subjects:
  - kind: Group
    name: forgeai-github-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: forgeai-github-deployer
  apiGroup: rbac.authorization.k8s.io
