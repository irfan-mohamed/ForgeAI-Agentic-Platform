services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: forgeai
      POSTGRES_PASSWORD: Irfan@123
      POSTGRES_DB: forgeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeai -d forgeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./Services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Services/api:/app
    environment:
      DATABASE_URL: postgresql+psycopg://forgeai:Irfan%40123@db:5432/forgeai
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
    depends_on:
      db:
        condition: service_healthy

  # ── Repository Service ──────────────────────────────────────────────────────
  repository:
    build:
      context: ./Services/repository
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./Services/repository:/app
    environment:
      DATABASE_URL: postgresql+psycopg://forgeai:Irfan%40123@db:5432/forgeai
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_NAME: ${GITHUB_APP_NAME:-forgeai-dev}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CALLBACK_REDIRECT_URL: ${GITHUB_CALLBACK_REDIRECT_URL:-http://localhost:5173/github/callback}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
      - repository

volumes:
  postgres_data:
