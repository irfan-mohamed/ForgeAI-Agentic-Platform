services:
  api:
    build:
      context: ./Services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Services/api:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://forgeai:Irfan%40123@db:5432/forgeai
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: forgeai
      POSTGRES_PASSWORD: Irfan@123
      POSTGRES_DB: forgeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeai -d forgeai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
